  addEventListener('error', function (e) { if (e.target && e.target !== window) return; melde((e.message || 'Fehler') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0)); }, true);
  addEventListener('unhandledrejection', function (e) { var r = e.reason, t = String(r && r.message || r); if (/fetch|network|load failed|abort/i.test(t)) return; melde('Promise: ' + t); });
  setTimeout(function () { if (window.__srBereit) return; var d = document.createElement('div'); d.setAttribute('role', 'alert'); d.style.cssText = 'position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#0e0d0b;color:#f3eee5;font:16px/1.5 Manrope,sans-serif;text-align:center;padding:24px';

})();</script>
